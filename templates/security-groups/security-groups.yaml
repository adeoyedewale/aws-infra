AWSTemplateFormatVersion: 2010-09-09
Description: "Security Groups for SSH Access (Specific IPs) and Internet-Facing ALB"

Parameters:
  SshAccessAllowedIP1:
    Type: String
    Description: "Michelle WS Home"
  SshAccessAllowedIP2:
    Type: String
    Description: "Michelle WS Home 2"
  SshAccessAllowedIP3:
    Type: String
    Description: "Nick Home 2"
  SshAccessAllowedIP4:
    Type: String
    Description: "Troy WS Home"
  SshAccessAllowedIP5:
    Type: String
    Description: "WS Office"
  SshAccessAllowedIP6:
    Type: String
    Description: "Cindy WS Home"
  SshAccessAllowedIP7:
    Type: String
    Description: "Tin WS Home"
  SshAccessAllowedIP8:
    Type: String
    Description: "Nick WS Home"
  SshAccessAllowedIP9:
    Type: String
    Description: "Wale WS Home"
  SshAccessAllowedIP10:
    Type: String
    Description: "OPENVPN Access"
  SshAccessAllowedIP11:
    Type: String
    Description: "Chris WS Home"

Resources:
  SshAccessSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allows SSH access only from specific IPs"
      VpcId: !ImportValue networking-VPCId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP1}/32"
          Description: "Michelle WS Home"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP2}/32"
          Description: "Michelle WS Home 2"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP3}/32"
          Description: "Nick Home 2"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP4}/32"
          Description: "Troy WS Home"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP5}/32"
          Description: "WS Office"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP6}/32"
          Description: "Cindy WS Home"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP7}/32"
          Description: "Tin WS Home"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP8}/32"
          Description:  "Nick WS Home"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP9}/32"
          Description: "Wale WS Home"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP10}/32"
          Description: "OPENVPN Access"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${SshAccessAllowedIP11}/32"
          Description: "Chris WS Home"
      Tags:
        - Key: Name
          Value: "SSH_ACCESS"

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allows HTTP/HTTPS traffic from anywhere"
      VpcId: !ImportValue networking-VPCId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: "Allows HTTP traffic"
        - IpProtocol: "tcp"
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: "Allows HTTPS traffic"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: "INTERNET_FACING_ALB"

Outputs:
  SshAccessSecurityGroupId:
    Description: "Security Group ID for SSH Access"
    Value: !Ref SshAccessSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-SshAccessSecurityGroupId"

  AlbSecurityGroupId:
    Description: "Security Group ID for Internet-Facing ALB"
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AlbSecurityGroupId"